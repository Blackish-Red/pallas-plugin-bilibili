[project]
name = "pallas-plugin-bilibili"
version = "0.1.19"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nonebot2>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "multidict>=6.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pallas_plugin_bilibili"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# 传递依赖安全下限。
[tool.uv]
constraint-dependencies = [
    "multidict>=6.9.1",
]
